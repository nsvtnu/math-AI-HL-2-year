<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#0a1628"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="170" cy="35" r="1" fill="white" opacity="0.9"/>
  <circle cx="160" cy="160" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="25" cy="170" r="1" fill="white" opacity="0.8"/>
  <circle cx="180" cy="90" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="15" cy="100" r="1" fill="white" opacity="0.7"/>
  <circle cx="190" cy="50" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="35" cy="180" r="1" fill="white" opacity="0.9"/>
  
  <!-- Glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#ff8c00;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6347;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Glow circle -->
  <circle cx="100" cy="100" r="85" fill="url(#glow)"/>
  
  <!-- Cat head -->
  <circle cx="100" cy="100" r="50" fill="#d4a574"/>
  
  <!-- Ears -->
  <polygon points="70,65 60,35 80,50" fill="#d4a574"/>
  <polygon points="130,65 140,35 120,50" fill="#d4a574"/>
  <polygon points="72,62 68,50 76,60" fill="#ffb6c1"/>
  <polygon points="128,62 132,50 124,60" fill="#ffb6c1"/>
  
  <!-- Eyes (big and cute) -->
  <circle cx="85" cy="95" r="10" fill="#1a1a1a"/>
  <circle cx="115" cy="95" r="10" fill="#1a1a1a"/>
  <circle cx="87" cy="92" r="3" fill="white"/>
  <circle cx="117" cy="92" r="3" fill="white"/>
  
  <!-- Nose -->
  <polygon points="100,110 95,120 105,120" fill="#ff69b4"/>
  
  <!-- Mouth -->
  <path d="M 100 120 Q 95 125 90 123" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 120 Q 105 125 110 123" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
