<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#E6D2B9">
<title>Mathkitty — AI HL semester companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo"></div>
      <div>
        <div class="brand-name">Mathkitty</div>
        <div class="brand-sub">AI HL · semester 1</div>
      </div>
    </div>
    <button id="search-open" class="search-fake">Search everything… <span class="kbd">/</span></button>
    <nav id="nav"></nav>
    <div id="side-foot">
      <button id="theme-btn" class="ghost-btn">Theme</button>
      <button id="reset-btn" class="ghost-btn" title="Erase progress on this device">Reset</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menu-btn" aria-label="Menu">☰</button>
      <div id="crumb">Mission control</div>
      <div class="top-chips">
        <span id="streak-pill" title="Days in a row with at least one question answered">Streak 0</span>
        <span id="xp-pill" title="XP from correct answers">XP 0</span>
        <div id="account-wrap"></div>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="auth-overlay" hidden>
  <div id="auth-panel">
    <div id="auth-kitty"></div>
    <h3 id="auth-title">Sign in to Mathkitty</h3>
    <p class="auth-sub">Your progress syncs across devices, and you appear on the class leaderboard.</p>
    <input id="auth-user" type="text" placeholder="username" autocomplete="username" maxlength="16">
    <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password">
    <div id="auth-error" hidden></div>
    <div class="auth-actions">
      <button id="auth-login" class="btn">Sign in</button>
      <button id="auth-signup" class="btn gray">Create account</button>
    </div>
    <button id="auth-close" class="ghost-btn">Cancel</button>
  </div>
</div>

<div id="search-overlay" hidden>
  <div id="search-panel">
    <input id="search-input" type="text" placeholder="Search units, notes, questions, syllabus… (Esc closes)" autocomplete="off">
    <div id="search-results"></div>
  </div>
</div>

<script src="js/kitty.js"></script>
<script src="js/mtex.js"></script>
<script src="js/viz.js"></script>
<script src="js/store.js"></script>
<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="data/units.js"></script>
<script src="data/bank.js"></script>
<script src="data/resources.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
